[project]
site_name = "FlexCloud"
site_author = "TUMFTM"
site_description = "Direct, modular georeferencing and drift-correction of point cloud maps"
site_url = "https://TUMFTM.github.io/FlexCloud"
repo_url = "https://github.com/TUMFTM/FlexCloud"
copyright = "Copyright &copy; 2025 - 2026 TUMFTM"
use_directory_urls = false

extra_css = [
  "https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css",
]

nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Test Data & Visualization" = "test-data.md" },
  { "Functionality & References" = "functionality.md" },
  { "Version Details" = [
    { "Overview" = "version_details/index.md" },
    { "Latest" = "version_details/latest.md" },
    # VERSION_NAV_START
    "version_details/1.0.1.md",
    "version_details/1.0.0.md",
    # VERSION_NAV_END
  ] },
]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/TUMFTM/FlexCloud"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
